- job:
    name: update-osmo-ci-on-slaves
    project-type: matrix
    axes:
      - axis:
          type: slave
          name: label
          values:
            - build4-deb12build-ansible
            - build5-deb12build-ansible
            - gtp0-deb10fr
            - lx2-raspbian13build-ansible
            - rpi4-raspbian12build-ansible-1
            - rpi4-raspbian12build-ansible-2
            - rpi4-raspbian12build-ansible-3
            - simtester
    properties:
      - build-discarder:
          days-to-keep: 30
          num-to-keep: 120
    parameters:
      - string:
          name: OSMO_BRANCH_CI
          description: |
                osmo-ci.git branch
          default: 'master'
    scm:
      - git:
          url: https://gerrit.osmocom.org/osmo-ci
          git-config-name: 'Jenkins Builder'
          git-config-email: 'jenkins@osmocom.org'
          skip-tag: true
          branches:
            - '$OSMO_BRANCH_CI'
          wipe-workspace: true

    triggers:
      - pollscm:
          cron: "H/5 * * * *"
          ignore-post-commit-hooks: false
      - timed: "H H * * *"

    builders:
      - shell: './scripts/update-osmo-ci/update-osmo-ci.sh'

    wrappers:
    - ansicolor:
        colormap: xterm

    description: |
      <b>Auto-generated using Jenkins Job Builder. DO NOT EDIT MANUALLY!</b>

    publishers:
      - email:
          recipients: jenkins-notifications@lists.osmocom.org


